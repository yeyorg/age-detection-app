variables:
  UV_VERSION: "0.10.9"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: "trixie-slim"
  UV_CACHE_DIR: ".uv-cache"
  UV_COMPILE_BYTECODE: "1"
  # 1. Cambiamos a symlink para evitar duplicados
  UV_LINK_MODE: "symlink" 
  PYTHONDONTWRITEBYTECODE: "1"
  INSTALL_SYS_DEPS: "apt-get update && apt-get install -y --no-install-recommends make libglib2.0-0 libgl1 libxcb1 && apt-get clean && rm -rf /var/lib/apt/lists/*"

.uv-base:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  before_script:
    - eval "$INSTALL_SYS_DEPS"
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
      # 2. Usamos 'pull-push' solo si es necesario; si el espacio es crítico, considera 'pull'
      policy: pull-push

run_tests:
  extends: .uv-base
  variables:
    # Mantenemos esto para ayudar a pytest a encontrar el paquete instalado
    PYTHONPATH: "src" 
  script:
    # 1. Sincronización limpia (instala el proyecto por defecto)
    - uv sync --frozen --group dev
    
    # 2. Verificación de diagnóstico (opcional pero recomendada para depurar)
    - uv run python -c "import sys; print(sys.path)"
    
    # 3. Ejecución de tests
    # Usamos 'python -m pytest' para garantizar que use el entorno virtual actual
    - uv run python -m pytest tests/
  after_script:
    - rm -rf .venv/
    # Eliminamos la caché para asegurar que no se agote el disco en el próximo run
    - rm -rf $UV_CACHE_DIR