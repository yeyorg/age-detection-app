variables:
  UV_VERSION: "0.10.9"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: "trixie-slim"
  UV_CACHE_DIR: ".uv-cache"
  UV_COMPILE_BYTECODE: "1"
  # 1. Cambiamos a symlink para evitar duplicados
  UV_LINK_MODE: "symlink" 
  PYTHONDONTWRITEBYTECODE: "1"
  INSTALL_SYS_DEPS: "apt-get update && apt-get install -y --no-install-recommends make libglib2.0-0 libgl1 libxcb1 && apt-get clean && rm -rf /var/lib/apt/lists/*"

.uv-base:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  before_script:
    - eval "$INSTALL_SYS_DEPS"
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
      # 2. Usamos 'pull-push' solo si es necesario; si el espacio es crítico, considera 'pull'
      policy: pull-push

run_tests:
  extends: .uv-base
  variables:
    # Eliminamos PYTHONPATH manual para evitar conflictos con la instalación editable
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    # 1. Sincronizamos e instalamos el proyecto actual en modo editable (-)
    # Esto registra src/age_detection_service como un paquete importable
    - uv sync --frozen --group dev
    
    # 2. Verificamos que el paquete sea importable (si esto falla, el log nos dirá por qué)
    - uv run python -c "import age_detection_service.api.app; print('Importación exitosa')"
    
    # 3. Ejecutamos los tests. 
    # Al estar instalado el proyecto, pytest encontrará 'age_detection_service' automáticamente.
    - uv run pytest tests/
  after_script:
    - rm -rf .venv/
    - rm -rf $UV_CACHE_DIR