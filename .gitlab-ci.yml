variables:
  UV_VERSION: "0.10.9"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: "trixie-slim"
  UV_CACHE_DIR: ".uv-cache"
  DOCKER_TLS_CERTDIR: "/certs"
  UV_LINK_MODE: "hardlink"
  PYTHONDONTWRITEBYTECODE: "1"
.uv-base:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  variables:
    # Añadimos limpieza de apt al final del comando
    INSTALL_SYS_DEPS: "apt-get update && apt-get install -y --no-install-recommends make libglib2.0-0 libgl1 libxcb1 && apt-get clean && rm -rf /var/lib/apt/lists/*"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
    # IMPORTANTE: Si el espacio sigue siendo un problema, podemos limitar la caché
    policy: pull-push 

run_tests:
  extends: .uv-base
  stage: test
  variables:
    # 1. Forzamos a Python a mirar en src si la instalación falla por algún motivo
    PYTHONPATH: "src"
    # 2. Optimizamos para que los tests no intenten usar GPU en el Runner
    CUDA_VISIBLE_DEVICES: "-1"
  script:
    # Sincronizamos e instalamos el proyecto actual en el venv del Runner
    - uv sync --frozen
    # Ejecutamos con python -m para resolver correctamente los namespaces de src
    - uv run python -m pytest tests/