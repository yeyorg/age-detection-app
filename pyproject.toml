[project]
name = "age-detection-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soporteERP", email = "soporte.erp2@plataforma.com.co" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.6.0",
    "fastapi>=0.115.0",
    "matplotlib>=3.10.0",
    "mlflow>=3.10.1",
    "pillow>=12.1.1",
    "python-multipart>=0.0.18",
    "scikit-learn>=1.7.0",
    "streamlit>=1.55.0",
    "tensorflow>=2.21.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.3.0",
    "uvicorn>=0.34.0",
]


[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]
